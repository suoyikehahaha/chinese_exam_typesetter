[project]
name = "chinese-exam-typesetter"
version = "0.4.0"
description = "高中语文试卷结构化排版与 DOCX 导出"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.12",
  "python-docx>=1.1",
  "Pillow>=10.0",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
